# Bonus A — Exposer le site via l'Ingress Controller Traefik (fourni par k3s).
# Le port 8081 du Codespace est relié au port 80 du load balancer k3d (option -p à la création du cluster).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site     # le Service du site
                port:
                  number: 80   # le port exposé par ce Service
